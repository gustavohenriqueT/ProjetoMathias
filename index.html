<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demonstração · Atendimento com IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --paper:#F2F5F7; --card:#FFFFFF; --ink:#0F1B2B; --muted:#526273; --line:#D9E0E7;
  --brand:#0A7C76; --brand-strong:#06605B; --brand-soft:#DAF0EE; --on-brand:#FFFFFF;
  --amber:#8A5700; --amber-bg:#FFF1CF; --amber-line:#EBCB78;
  --shadow:0 1px 2px rgba(15,27,43,.06),0 14px 30px -18px rgba(15,27,43,.28);
  --head:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --wa-head:#008069; --wa-bg:#EFEAE2; --wa-out:#D9FDD3; --wa-in:#FFFFFF; --wa-ink:#111B21;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#0B1320; --card:#121E2E; --ink:#E6EDF4; --muted:#93A5B7; --line:#243449;
    --brand:#3DC7BD; --brand-strong:#7FE0D8; --brand-soft:#123B3C; --on-brand:#06201F;
    --amber:#F2BC55; --amber-bg:#3A2E13; --amber-line:#6B5321;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 30px -18px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#0B1320; --card:#121E2E; --ink:#E6EDF4; --muted:#93A5B7; --line:#243449;
  --brand:#3DC7BD; --brand-strong:#7FE0D8; --brand-soft:#123B3C; --on-brand:#06201F;
  --amber:#F2BC55; --amber-bg:#3A2E13; --amber-line:#6B5321;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 30px -18px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
h4{margin:0;font:700 13px var(--body)}
p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1560px;margin:0 auto;padding:0 clamp(12px,2.4vw,28px)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:54px;padding-block:8px}
.logo{font:700 17px var(--head);letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.logo i{width:26px;height:26px;border-radius:8px;background:var(--brand);display:grid;place-items:center;color:var(--on-brand);font-style:normal;font-size:14px}
.demo{font-size:11.5px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:999px;background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-line)}
.sp{margin-left:auto;display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:999px;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.theme{width:34px;height:34px;padding:0;display:grid;place-items:center}
@media (max-width:520px){.logo span{display:none}.top .wrap{gap:8px}}

.tabs{display:none;gap:6px;padding:10px 0 2px}
.tabs button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 6px;font-weight:600;font-size:13px;position:relative}
.tabs button[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.tabs button.dot::after{content:"";position:absolute;top:6px;right:12px;width:8px;height:8px;border-radius:50%;background:#E5484D}

.app{display:grid;gap:16px;padding:16px 0 32px;grid-template-columns:320px minmax(0,1fr) minmax(0,1.1fr);align-items:stretch}
@media (max-width:1359px){.app{grid-template-columns:320px minmax(0,1fr)}.col-g{grid-column:1 / -1}}
@media (max-width:1000px){
  .tabs{display:flex}
  .app{grid-template-columns:1fr;padding-top:10px}
  .col:not(.on){display:none}
  .col-c{max-width:400px;width:100%;margin:0 auto}
}
.lab{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:0 0 6px 2px}
.col{display:flex;flex-direction:column;min-width:0}
.panel{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-height:640px}

/* celular */
.phone{flex:1;border:8px solid #17222C;border-radius:30px;background:var(--wa-bg);overflow:hidden;display:flex;flex-direction:column;min-height:640px;box-shadow:var(--shadow)}
.wa-h{background:var(--wa-head);color:#fff;padding:12px 14px;display:flex;gap:10px;align-items:center}
.av{width:36px;height:36px;border-radius:50%;background:#fff;color:var(--wa-head);display:grid;place-items:center;font:700 16px var(--head);flex:none}
.wa-h b{display:block;font-size:15px;line-height:1.2}
.wa-h small{font-size:12px;opacity:.85}
.chat{flex:1;padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;color:var(--wa-ink);min-height:0}
.day,.ad{align-self:center;background:#fff;color:#54656f;font-size:11.5px;padding:3px 10px;border-radius:8px;box-shadow:0 1px 1px rgba(0,0,0,.08);text-align:center}
.b{max-width:86%;padding:7px 10px 5px;border-radius:9px;font-size:14px;line-height:1.4;box-shadow:0 1px 1px rgba(0,0,0,.1);overflow-wrap:anywhere}
.b time{display:block;text-align:right;font-size:10.5px;color:#667781;margin-top:2px}
.b.out{align-self:flex-end;background:var(--wa-out);border-top-right-radius:2px}
.b.in{align-self:flex-start;background:var(--wa-in);border-top-left-radius:2px}
.b .who{display:block;font-size:11.5px;font-weight:700;color:#06795F;margin-bottom:1px}
.typing{align-self:flex-start;background:#fff;border-radius:9px;padding:9px 12px;display:flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:#9aa7ae;animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.3}30%{opacity:1}}
.pop{animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sug{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;background:#F0F2F5;border-top:1px solid #dfe3e6}
.sug button{flex:none;border:1px solid #cfd6da;background:#fff;color:#33434c;border-radius:999px;padding:6px 12px;font-size:12.5px;white-space:nowrap}
.sug button:hover{border-color:var(--wa-head);color:var(--wa-head)}
.wa-f{background:#F0F2F5;padding:8px 10px 10px;display:flex;gap:8px}
.wa-f input{flex:1;min-width:0;background:#fff;border:0;border-radius:20px;padding:9px 14px;font-size:14px;color:#111b21}
.wa-f input::placeholder{color:#8696a0}
.wa-f button{width:38px;height:38px;border-radius:50%;border:0;background:var(--wa-head);color:#fff;font-size:16px;flex:none}
.wa-f button:disabled,.wa-f input:disabled{opacity:.5}

/* vendedor */
.cvs{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);overflow-x:auto;background:var(--paper)}
.cv{flex:1 0 140px;display:flex;gap:8px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px;min-width:0}
.cv[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 22%,transparent)}
.cv .avt{width:30px;height:30px;font-size:12px}
.cv b{display:block;font-size:13px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv small{font-size:11.5px;color:var(--muted);display:flex;gap:5px;align-items:center}
.st{width:8px;height:8px;border-radius:50%;background:var(--brand);flex:none}
.st.h{background:#D98E04}.st.f{background:var(--brand-strong);box-shadow:0 0 0 2px var(--brand-soft)}
.avt{width:36px;height:36px;border-radius:50%;background:var(--brand-soft);color:var(--brand-strong);display:grid;place-items:center;font:700 14px var(--head);flex:none}
.vbody{flex:1;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0}
.vh{display:flex;gap:10px;align-items:flex-start}
.vh>div:nth-child(2){flex:1;min-width:0}
.vh b{font-size:15px}
.vh .sp{margin-left:auto;flex:none}
.pill{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand-strong);white-space:nowrap}
.pill.warn{background:var(--amber-bg);color:var(--amber)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tg{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--paper);border:1px solid var(--line);color:var(--muted)}
.tg.src{background:var(--brand-soft);border-color:transparent;color:var(--brand-strong);font-weight:600}
.toast{background:var(--ink);color:var(--paper);border-radius:10px;padding:9px 13px;font-size:13px;display:flex;gap:8px}
.note{background:var(--amber-bg);border:1px solid var(--amber-line);border-radius:10px;padding:10px 12px}
.note h4{color:var(--amber);margin-bottom:4px}
.note ul{margin:0;padding-left:18px;font-size:13px}
.tr{flex:1;min-height:120px;border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:10px;display:flex;flex-direction:column;gap:7px;overflow-y:auto}
.m{max-width:85%;padding:6px 10px;border-radius:10px;font-size:13px;line-height:1.4;border:1px solid var(--line);background:var(--card);overflow-wrap:anywhere}
.m small{display:block;font-size:10.5px;font-weight:700;color:var(--muted)}
.m.ia{align-self:flex-end;background:var(--brand-soft);border-color:transparent}
.m.v{align-self:flex-end;background:var(--brand);color:var(--on-brand);border-color:transparent}
.m.v small{color:var(--on-brand);opacity:.85}
.m.s{align-self:center;max-width:95%;text-align:center;font-size:12px;color:var(--muted);background:transparent;border-style:dashed}
.compose{display:flex;gap:8px}
.compose input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:13.5px}
.vq{display:flex;gap:6px;flex-wrap:wrap}

/* gestor */
.dash{padding:14px;display:grid;gap:12px;align-content:start}
.kg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:520px){.kg{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kp{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper)}
.kp b{font:700 24px/1.1 var(--head);letter-spacing:-.02em;display:inline-block;padding:0 5px;margin-left:-5px;border-radius:7px}
.kp b.fl{animation:fl 1.4s ease-out}
@keyframes fl{0%{background:var(--brand-soft)}100%{background:transparent}}
.kp small{display:block;font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:700px){.two{grid-template-columns:1fr}}
.bx{border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.bx h4{margin-bottom:8px;color:var(--muted)}
.chart text{font:500 10.5px var(--body);fill:var(--muted)}
.fun{display:grid;gap:8px}
.fun .r{display:grid;grid-template-columns:96px 1fr 44px;gap:8px;align-items:center;font-size:12.5px}
.fun .r b{text-align:right}
.bar{height:12px;border-radius:99px;background:var(--paper);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .5s}
.rows{display:grid;gap:7px}
.rw{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr) 46px;gap:8px;align-items:center;font-size:12.5px;padding:3px 6px;margin:0 -6px;border-radius:7px}
.rw span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw b{text-align:right}
.rw.hot{background:var(--brand-soft)}
.tm{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="logo"><i aria-hidden="true">✦</i><span id="brandTop">Atendimento com IA</span></div>
    <span class="demo">DEMO</span>
    <div class="sp">
      <button class="btn" id="reset">Recomeçar</button>
      <button class="btn theme" id="theme" aria-label="Alternar tema claro e escuro">◐</button>
    </div>
  </div>
</header>

<main class="wrap">
  <nav class="tabs" id="tabs" role="tablist" aria-label="Telas">
    <button role="tab" data-v="c" aria-selected="true">Cliente</button>
    <button role="tab" data-v="v" aria-selected="false">Vendedor</button>
    <button role="tab" data-v="g" aria-selected="false">Gestor</button>
  </nav>

  <div class="app">
    <div class="col col-c on" data-p="c">
      <div class="lab">CLIENTE</div>
      <section class="phone" aria-label="WhatsApp do cliente">
        <div class="wa-h"><div class="av" id="av">L</div><div><b id="brand">Loja Exemplo</b><small>Conta comercial</small></div></div>
        <div class="chat" id="chat" role="log" aria-live="polite"></div>
        <div class="sug" id="sug"></div>
        <form class="wa-f" id="cform" autocomplete="off">
          <input id="cin" type="text" placeholder="Mensagem" aria-label="Mensagem do cliente" maxlength="300">
          <button type="submit" aria-label="Enviar">➤</button>
        </form>
      </section>
    </div>

    <div class="col col-v" data-p="v">
      <div class="lab">VENDEDOR</div>
      <section class="panel" aria-label="Painel do vendedor">
        <div class="cvs" id="cvs"></div>
        <div class="vbody" id="vbody"></div>
      </section>
    </div>

    <div class="col col-g" data-p="g">
      <div class="lab">GESTOR</div>
      <section class="panel dash" id="dash" aria-label="Painel do gestor"></section>
    </div>
  </div>
</main>

<script>
/* ===== Personalize aqui ===== */
const CFG = {
  brand:'Loja Exemplo', initial:'L', seller:'Carlos', sellerFull:'Carlos Eduardo',
  customer:'João Silva', phone:'+55 11 99999-9999', origin:'Instagram Ads · PromoX'
};
const CAT = [
  {g:'a',nome:'Cadeira Ergonômica Pro',  preco:890,  estoque:14, desc:'encosto com ajuste lombar e apoio de braço 3D', kw:['cadeira','ergonomica','ergonomico','sentar']},
  {g:'a',nome:'Mesa Home Office 140 cm', preco:640,  estoque:6,  desc:'tampo em MDF de 25 mm com passa-cabos',        kw:['mesa','escrivaninha','home office','bancada']},
  {g:'o',nome:'Monitor 27" Full HD',     preco:1190, estoque:0,  desc:'painel IPS de 75 Hz',                          kw:['monitor','tela']},
  {g:'o',nome:'Suporte para Notebook',   preco:149,  estoque:32, desc:'alumínio ajustável em 6 alturas',              kw:['suporte','notebook']}
];
const SUGS = ['Oi, vi o anúncio. Tem cadeira ergonômica?','Quanto custa?','Tem monitor?','Qual o prazo de entrega?','Quero fechar o pedido'];
/* Números-base do painel (ilustrativos) */
const KP0 = {leads:18, equipe:7, vendas:2, receita:1780};
const WEEK = {leads:[118,126,141,152,163,171,186,191], equipe:[53,57,63,69,74,78,84,90]};
const FUN0 = {leads:1248, equipe:568, orc:241, vendas:87};
const CAMP0 = [['PromoX · Instagram',520,36,true],['Stories · Instagram',190,16],['Google · Marca',310,22],['Orgânico e direto',228,13]];
const PROD0 = {'Cadeira Ergonômica Pro':214,'Mesa Home Office 140 cm':168,'Suporte para Notebook':131,'Monitor 27" Full HD':97};
const SELL0 = [['Carlos Eduardo',38,true],['Mariana Souza',28],['Roberto Alves',21]];
const SEEDS = {
  maria:{name:'Maria Oliveira',ini:'MO',st:'h',lbl:'Recorrente',who:'Mariana Souza',tags:['#lead-qualificado','#atendimento-humano'],
    msgs:[['c','Oi, preciso repor aquele kit de novo.'],['ia','Oi, Maria! Que bom ter você de volta 😊 Quer o mesmo da última vez?'],['c','Isso! Tem em estoque?']]},
  pedro:{name:'Pedro Lima',ini:'PL',st:'h',lbl:'Orçamento',who:'Roberto Alves',tags:['#orcamento-enviado'],
    msgs:[['c','Vocês fazem kit com 3 unidades?'],['v','Pedro, segue o orçamento: R$ 780,00.','Roberto Alves'],['s','24h sem resposta · follow-up enviado'],['ia','Oi, Pedro! Conseguiu ver o orçamento?']]}
};
/* ============================ */

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const hhmm=()=>new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const first=CFG.customer.split(' ')[0];
const ar=p=>p.g==='a'?'a':'o', de=p=>p.g==='a'?'da':'do', Ar=p=>p.g==='a'?'A':'O';
const ini=n=>n.split(' ').map(x=>x[0]).join('').slice(0,2);

let S, last={};
function fresh(){S={msgs:[],product:null,mode:'idle',tags:[],toast:false,note:null,typing:false,sel:'maria',shown:{},flags:{v:false,g:false},d:{leads:0,equipe:0,orc:0,vendas:0,receita:0,prod:{}}};last={};}

/* ----- "cérebro" simulado ----- */
function findProduct(t){
  let best=null,score=0;
  CAT.forEach(p=>{const s=p.kw.filter(k=>t.includes(norm(k))).length;if(s>score){score=s;best=p;}});
  return best;
}
function respond(text){
  const t=norm(text);
  const isFirst=!S.msgs.some(m=>m.from==='ia');
  const greet=isFirst?`Olá! 👋 Bem-vindo(a) à ${CFG.brand}. `:'';
  if(/\b(parar|sair da lista|nao quero receber)\b/.test(t)) return {reply:'Tudo bem! Não vou mais enviar mensagens. Se precisar, é só chamar. 🙂'};
  const buy=/(fechar|finalizar|comprar|vou levar|vou querer|quero (esse|essa|ele|ela|levar|o pedido|ja)|como pago|pode mandar|\bpix\b|pagar)/.test(t);
  const outside=/(entrega|prazo|frete|desconto|parcel|troca|garantia|nota fiscal|cnpj|atacado)/.test(t);
  const human=/(atendente|vendedor|humano|pessoa|especialista|falar com alguem)/.test(t);
  const found=findProduct(t);
  if(found){S.product=found;S.d.prod[found.nome]=(S.d.prod[found.nome]||0)+1;}
  if(outside||human)
    return {reply:`${greet}Boa pergunta! Isso é com a nossa equipe. Vou chamar o ${CFG.seller} para te ajudar, um instante! 🙌`,handoff:outside?'Dúvida fora do catálogo (prazo, entrega, condições ou garantia).':'Cliente pediu para falar com um atendente.'};
  if(buy){
    if(S.product){const p=S.product;
      return {reply:`Perfeito! Vou passar o seu atendimento para o ${CFG.seller}, nosso especialista, para finalizar a compra ${de(p)} ${p.nome}. Só um instante! 🙌`,handoff:p.estoque?'Cliente pronto para fechar.':'Cliente quer comprar, mas o produto está sem estoque: verificar reposição.'};}
    return {reply:`${greet}Que ótimo! Qual produto você quer levar? Temos cadeira, mesa, monitor e suporte para notebook.`};
  }
  if(found){
    if(!found.estoque) return {reply:`${greet}${Ar(found)} ${found.nome} está sem estoque no momento 😕 Posso te indicar uma alternativa ou chamar um especialista para ver a reposição. O que prefere?`};
    return {reply:`${greet}${Ar(found)} ${found.nome} está por ${brl(found.preco)} e temos ${found.estoque} em estoque. Detalhes: ${found.desc}. Quer fechar o pedido ou prefere ver outra opção?`};
  }
  if(S.product&&/(quanto|preco|valor|custa)/.test(t)) return {reply:`${Ar(S.product)} ${S.product.nome} está por ${brl(S.product.preco)}. Quer fechar o pedido?`};
  if(S.product&&/(tem|estoque|disponivel|entrega imediata)/.test(t)) return {reply:S.product.estoque?`Temos ${S.product.estoque} unidades ${de(S.product)} ${S.product.nome} em estoque.`:`${Ar(S.product)} ${S.product.nome} está sem estoque no momento.`};
  if(/\b(oi|ola|bom dia|boa tarde|boa noite|e ai)\b/.test(t)) return {reply:`${greet}Sou o assistente virtual e posso te ajudar com cadeira ergonômica, mesa home office, monitor e suporte para notebook. O que você procura?`};
  return {reply:`${greet}Não encontrei isso no nosso catálogo. Posso te ajudar com cadeira ergonômica, mesa home office, monitor ou suporte para notebook. Qual deles te interessa?`};
}

/* ----- ações ----- */
function add(from,text){S.msgs.push({from,text,t:hhmm()});}
function customerSend(text){
  text=text.trim(); if(!text||S.typing||S.mode==='fechada')return;
  add('c',text);
  if(S.mode==='idle'){S.mode='ia';S.sel='live';S.d.leads++;S.flags.v=S.flags.g=true;}
  if(S.mode==='humano'){S.flags.v=true;render();return;}
  S.typing=true;render();
  setTimeout(()=>{
    const r=respond(text);
    S.typing=false;add('ia',r.reply);
    if(r.handoff) handoff(r.handoff);
    render();
  },900);
}
function handoff(motivo){
  S.mode='humano';S.tags=['#lead-qualificado','#atendimento-humano'];S.d.equipe++;S.toast=true;S.flags.v=true;S.flags.g=true;
  S.note=[['Origem',CFG.origin],['Interesse',S.product?`${S.product.nome} · ${brl(S.product.preco)}`:'a definir'],['Contexto',motivo]];
}
function vendorSend(text){
  text=text.trim(); if(!text||S.mode!=='humano')return;
  add('v',text);S.toast=false;
  if(!S.tags.includes('#orcamento-enviado')){S.tags.push('#orcamento-enviado');S.d.orc++;S.flags.g=true;}
  render();
}
function closeSale(){
  if(S.mode!=='humano')return;
  add('v',`Pagamento confirmado! Obrigado pela compra, ${first} 🎉`);
  if(!S.tags.includes('#orcamento-enviado')){S.tags.push('#orcamento-enviado');S.d.orc++;}
  S.tags.push('#venda-fechada');S.mode='fechada';S.toast=false;S.d.vendas++;S.d.receita+=S.product?S.product.preco:0;S.flags.g=true;
  render();
}

/* ----- render: cliente ----- */
function renderPhone(){
  const chat=$('#chat');
  let h='<div class="day">Hoje</div>';
  if(S.msgs.length) h+=`<div class="ad">Veio de um anúncio · ${esc(CFG.origin)}</div>`;
  S.msgs.forEach((m,i)=>{
    const isNew=!S.shown['m'+i];S.shown['m'+i]=1;
    const cls=(m.from==='c'?'out':'in')+(isNew?' pop':'');
    const who=m.from==='v'?`<span class="who">${esc(CFG.sellerFull)}</span>`:'';
    h+=`<div class="b ${cls}">${who}${esc(m.text)}<time>${m.t}</time></div>`;
  });
  if(S.typing) h+='<div class="typing"><i></i><i></i><i></i></div>';
  chat.innerHTML=h;chat.scrollTop=chat.scrollHeight;
  const locked=S.typing||S.mode==='fechada';
  $('#cin').disabled=locked;$('#cform button').disabled=locked;
  $('#sug').hidden=S.mode==='humano'||S.mode==='fechada';
}

/* ----- render: vendedor ----- */
function convList(){
  const l=[];
  if(S.mode!=='idle') l.push({id:'live',name:CFG.customer,ini:ini(CFG.customer),st:S.mode==='ia'?'':S.mode==='humano'?'h':'f',lbl:S.mode==='ia'?'IA':S.mode==='humano'?'Humano':'Fechada'});
  Object.entries(SEEDS).forEach(([id,c])=>l.push({id,name:c.name,ini:c.ini,st:c.st,lbl:c.lbl}));
  return l;
}
function trHTML(msgs,nameC){
  return msgs.map(m=>{
    const k=m.from||m[0], txt=m.text||m[1], who=m[2];
    const label=k==='c'?esc(nameC):k==='ia'?'IA':k==='v'?esc(who||CFG.sellerFull):'';
    return `<div class="m ${k==='c'?'':k}">${label?`<small>${label}</small>`:''}${esc(txt)}</div>`;
  }).join('');
}
function renderVendor(){
  $('#cvs').innerHTML=convList().map(c=>`<button class="cv" data-id="${c.id}" aria-pressed="${c.id===S.sel}"><div class="avt">${esc(c.ini)}</div><div style="min-width:0"><b>${esc(c.name)}</b><small><i class="st ${c.st}"></i>${c.lbl}</small></div></button>`).join('');
  const b=$('#vbody');
  if(S.sel==='live'&&S.mode!=='idle'){
    const hum=S.mode==='humano';
    const pill=S.mode==='ia'?'<span class="pill">IA atendendo</span>':hum?`<span class="pill warn">${esc(CFG.seller)} atendendo</span>`:'<span class="pill">Venda fechada</span>';
    b.innerHTML=`
     <div class="vh"><div class="avt">${esc(ini(CFG.customer))}</div><div><b>${esc(CFG.customer)}</b><div class="tags" style="margin-top:2px"><span class="tg src">${esc(CFG.origin)}</span>${S.tags.map(t=>`<span class="tg">${t}</span>`).join('')}</div></div><span class="sp">${pill}</span></div>
     ${S.toast?`<div class="toast pop"><span aria-hidden="true">🔔</span><span>Nova oportunidade · <b>${esc(CFG.customer)}</b></span></div>`:''}
     ${S.note?`<div class="note"><h4>🤖 Resumo da IA</h4><ul>${S.note.map(([k,v])=>`<li><b>${k}:</b> ${esc(v)}</li>`).join('')}</ul></div>`:''}
     <div class="tr" id="tr">${trHTML(S.msgs,CFG.customer)}</div>
     ${hum?`<form class="compose" id="vform" autocomplete="off"><input id="vin" type="text" placeholder="Responder como ${esc(CFG.seller)}…" aria-label="Resposta do vendedor" maxlength="300"><button class="btn primary" type="submit">Enviar</button></form>
     <div class="vq"><button class="btn sm" type="button" data-q="pix">Enviar Pix</button><button class="btn sm" type="button" data-q="prazo">Confirmar entrega</button><button class="btn sm primary" type="button" data-q="fechar">Fechar venda</button></div>`:''}`;
  }else{
    const id=S.sel==='live'?'maria':S.sel,c=SEEDS[id]||SEEDS.maria;
    b.innerHTML=`
     <div class="vh"><div class="avt">${esc(c.ini)}</div><div><b>${esc(c.name)}</b><div class="tags" style="margin-top:2px">${c.tags.map(t=>`<span class="tg">${t}</span>`).join('')}</div></div><span class="sp"><span class="pill warn">${esc(c.who.split(' ')[0])}</span></span></div>
     <div class="tr">${trHTML(c.msgs.map(m=>({from:m[0],text:m[1],0:m[0],1:m[1],2:m[2]})),c.name)}</div>`;
  }
  const t=$('#tr');if(t)t.scrollTop=t.scrollHeight;
}

/* ----- render: gestor ----- */
function kpiB(key,val,txt){const ch=last[key]!==undefined&&last[key]!==val;last[key]=val;return `<b class="num${ch?' fl':''}">${txt}</b>`;}
function chartSVG(){
  const W=520,H=130,L=26,B=20,T=6,max=220,n=8,bw=30,gap=(W-L-n*bw)/n;
  let g='';
  [0,100,200].forEach(v=>{const y=T+(H-B-T)*(1-v/max);g+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+3.5}" text-anchor="end">${v}</text>`;});
  WEEK.leads.forEach((v0,i)=>{
    const lv=v0+(i===n-1?S.d.leads:0),qv=WEEK.equipe[i]+(i===n-1?S.d.equipe:0);
    const x=L+gap/2+i*(bw+gap),hl=(H-B-T)*lv/max,hq=(H-B-T)*qv/max,y=H-B;
    g+=`<g><title>${lv} conversas · ${qv} para a equipe</title><rect x="${x}" y="${y-hl}" width="${bw}" height="${hl}" rx="4" fill="var(--brand-soft)" stroke="var(--brand)"/><rect x="${x+7}" y="${y-hq}" width="${bw-14}" height="${hq}" rx="3" fill="var(--brand)"/><text x="${x+bw/2}" y="${H-5}" text-anchor="middle">${i===n-1?'Atual':'S'+(i+1)}</text></g>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Conversas por semana">${g}</svg>`;
}
function renderDash(){
  const d=S.d;
  const k={leads:KP0.leads+d.leads,equipe:KP0.equipe+d.equipe,vendas:KP0.vendas+d.vendas,receita:KP0.receita+d.receita};
  const f={leads:FUN0.leads+d.leads,equipe:FUN0.equipe+d.equipe,orc:FUN0.orc+d.orc,vendas:FUN0.vendas+d.vendas};
  const fun=[['Conversas',f.leads],['Para a equipe',f.equipe],['Orçamentos',f.orc],['Vendas',f.vendas]];
  const camp=CAMP0.map(([n,l,v,live])=>{const lv=l+(live?d.leads:0),vv=v+(live?d.vendas:0);return {n,lv,vv,live,changed:live&&(d.leads||d.vendas)};});
  const prods=Object.entries(PROD0).map(([n,v])=>[n,v+(d.prod[n]||0),!!d.prod[n]]).sort((a,b)=>b[1]-a[1]);
  const maxP=Math.max(...prods.map(p=>p[1]));
  const sell=SELL0.map(([n,v,live])=>[n,v+(live?d.vendas:0),live&&d.vendas]);
  const maxS=Math.max(...sell.map(s=>s[1]));
  $('#dash').innerHTML=`
   <div class="kg">
     <div class="kp">${kpiB('l',k.leads,k.leads.toLocaleString('pt-BR'))}<small>Conversas</small></div>
     <div class="kp">${kpiB('e',k.equipe,k.equipe)}<small>Equipe</small></div>
     <div class="kp">${kpiB('v',k.vendas,k.vendas)}<small>Vendas</small></div>
     <div class="kp">${kpiB('r',k.receita,brl(k.receita))}<small>Receita</small></div>
   </div>
   <div class="bx"><h4>Semanas</h4>${chartSVG()}</div>
   <div class="two">
     <div class="bx"><h4>Funil</h4><div class="fun">${fun.map(([n,v])=>`<div class="r"><span>${n}</span><div class="bar"><i style="width:${v/f.leads*100}%"></i></div><b class="num">${v.toLocaleString('pt-BR')}</b></div>`).join('')}</div></div>
     <div class="bx"><h4>Campanhas</h4><div class="rows">${camp.map(c=>`<div class="rw${c.changed?' hot':''}"><span>${c.n}</span><div class="bar"><i style="width:${c.lv/600*100}%"></i></div><b class="num">${(c.vv/c.lv*100).toFixed(1).replace('.',',')}%</b></div>`).join('')}</div></div>
   </div>
   <div class="two">
     <div class="bx"><h4>Produtos</h4><div class="rows">${prods.map(([n,v,hot])=>`<div class="rw${hot?' hot':''}"><span>${esc(n)}</span><div class="bar"><i style="width:${v/maxP*100}%"></i></div><b class="num">${v}</b></div>`).join('')}</div></div>
     <div class="bx"><h4>Equipe</h4><div class="tm"><span class="pill">IA · 8 s</span><span class="pill warn">Equipe · 4 min 15 s</span></div><div class="rows">${sell.map(([n,v,hot])=>`<div class="rw${hot?' hot':''}"><span>${n}</span><div class="bar"><i style="width:${v/maxS*100}%"></i></div><b class="num">${v}</b></div>`).join('')}</div></div>
   </div>`;
}

/* ----- abas (celular) ----- */
function tabs(){
  $$('#tabs button').forEach(b=>{b.classList.toggle('dot',!!S.flags[b.dataset.v]&&b.getAttribute('aria-selected')!=='true');});
}
function showTab(v){
  $$('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===v));
  $$('.col').forEach(c=>c.classList.toggle('on',c.dataset.p===v));
  S.flags[v]=false;tabs();
}
function render(){renderPhone();renderVendor();renderDash();tabs();}

/* ----- eventos ----- */
$('#cform').addEventListener('submit',e=>{e.preventDefault();const i=$('#cin');const v=i.value;i.value='';customerSend(v);});
$('#sug').innerHTML=SUGS.map(s=>`<button type="button">${esc(s)}</button>`).join('');
$('#sug').addEventListener('click',e=>{const b=e.target.closest('button');if(b)customerSend(b.textContent);});
$('#cvs').addEventListener('click',e=>{const b=e.target.closest('.cv');if(b){S.sel=b.dataset.id;renderVendor();}});
$('#vbody').addEventListener('submit',e=>{if(e.target.id==='vform'){e.preventDefault();const i=$('#vin');const v=i.value;i.value='';vendorSend(v);}});
$('#vbody').addEventListener('click',e=>{
  const b=e.target.closest('[data-q]');if(!b)return;
  const q=b.dataset.q,p=S.product;
  if(q==='pix')vendorSend(`Oi, ${first}! Aqui é o ${CFG.seller}, da equipe de vendas. ${p?`Já vi o seu pedido ${de(p)} ${p.nome}, o total fica ${brl(p.preco)}. `:''}Posso te enviar o Pix?`);
  if(q==='prazo')vendorSend(`${first}, vou confirmar o prazo de entrega para o seu CEP e já te respondo por aqui.`);
  if(q==='fechar')closeSale();
});
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)showTab(b.dataset.v);});
$('#reset').addEventListener('click',()=>{fresh();showTab('c');render();});
$('#theme').addEventListener('click',()=>{
  const r=document.documentElement;
  const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme=dark?'light':'dark';
});
$('#brand').textContent=CFG.brand;$('#av').textContent=CFG.initial;
fresh();render();
</script>
</body>
